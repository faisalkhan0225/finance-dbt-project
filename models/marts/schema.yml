# models/marts/schema.yml

version: 2

models:
  - name: fct_transactions
    description: "Fact table for all financial transactions"
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: amount
        data_tests:
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments: 
                values: ['COMPLETED', 'PENDING', 'FAILED']
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id

  - name: dim_accounts
    description: "SCD Type 2 dimension for accounts"
    columns:
      - name: account_id
        data_tests:
          - not_null